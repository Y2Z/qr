name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-22.04, ubuntu-24.04, macos-14, macos-15 ]

    steps:
    - uses: actions/checkout@v4

    - name: Resolve dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update && \
        sudo apt-get install autoconf \
          fonts-freefont-ttf \
          imagemagick \
          libqrencode-dev \
          zbar-tools

    - name: Resolve dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install autoconf \
          imagemagick \
          qrencode \
          zbar
        brew install --cask font-freefont
        echo "CPPFLAGS=-I$(brew --prefix)/include" >> "$GITHUB_ENV"
        echo "LDFLAGS=-L$(brew --prefix)/lib" >> "$GITHUB_ENV"

    - name: Build
      run: make CPPFLAGS="$CPPFLAGS" LDFLAGS="$LDFLAGS"

    - name: Test
      run: make test < /dev/null

    - name: Print test logs
      if: ${{ failure() }}
      run: cat tests.dir/*/*.log

    - name: Install
      run: sudo make PREFIX=/usr/local install

    - name: Run
      run: /usr/local/bin/qr Success

    - name: Uninstall
      run: sudo make PREFIX=/usr/local uninstall
